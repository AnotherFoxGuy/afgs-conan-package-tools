on: [push, pull_request]

name: "afgs-package-tools"

jobs:
  afgs-package-tools-test:
    name: Test Tools on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: "Build & Test"
      run: |
        pip install setuptools 
        pip install -e .[test]
        python setup.py sdist
        cd tests
        pytest -vvv -s
